name: CI

# Runs every step of scripts/gate.sh --strict except the browser tests and the public-relay Nostr tests.
# Linux only, three jobs (rust, wasm + node, docker build without push), cached builds, superseded runs cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WASM_MAX_BYTES: 358400  # same default as scripts/gate.sh (350 KiB)

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shared docs in the C ABI (the sync feature, off in the wasm and workspace builds)
        run: cargo clippy -p peerwire-ffi --features sync --all-targets -- -D warnings
      - run: cargo test --workspace --release
      - run: cargo test -p peerwire-ffi --features sync --release
      - name: Fuzz tests in a debug build (integer overflow panics there, wraps in release)
        run: |
          cargo test --lib -p peerwire-core -p peerwire -p peerwire-ffi -p peerwire-sim -p peerwire-sync fuzz
          cargo test --lib -p peerwire-ffi --features sync

  wasm:
    name: wasm + node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/web"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./packages/js/build.sh
      # scripts/gate.sh --strict reads this job's node-version and its `- run: node packages/<pkg>/test/<file>.mjs`
      # steps, and runs those again on that Node: keep a test step in that form (a FAIL there says which isn't).
      - name: Size (<= WASM_MAX_BYTES) and zero imports
        run: node .github/scripts/wasm-check.mjs packages/js/pkg/peerwire_ffi.wasm "$WASM_MAX_BYTES"
      - run: node packages/js/test/node_pair.mjs
      - run: node packages/js/test/wasm_source.mjs
      - run: node packages/js/test/privacy.mjs
      - run: node packages/js/test/room_node.mjs
      - run: node packages/js/test/peer_id.mjs
      - run: node packages/js/test/nostr_bounds.mjs
      - run: node packages/js/test/rust_hello.mjs
      - run: node packages/js/test/rust_doc.mjs
      - run: node packages/js/test/room_proof.mjs
      - run: node packages/js/test/pump_rearm.mjs
      - run: node packages/js/test/endpoint_closed.mjs
      - run: node packages/js/test/scratch_buffers.mjs
      - run: node packages/js/test/room_drain.mjs
      - run: node packages/js/test/fuzz.mjs
      - run: node packages/js/test/room_leave.mjs
      - run: node packages/js/test/room_welcome.mjs
      - run: node packages/js/test/room_fallback.mjs
      - run: node packages/js/test/room_adopt.mjs
      - run: node packages/js/test/room_same_nat.mjs
      - run: node packages/js/test/nat_predict.mjs
      - run: node packages/js/test/late_ice.mjs
      - run: node packages/js/test/birthday.mjs
      - name: '@peerwire/react: install, build, types'
        working-directory: packages/react
        run: npm ci --no-audit --no-fund && npm run build && npm run typecheck
      - run: node packages/react/test/store.mjs
      - run: node packages/react/test/hooks.mjs

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      # Build only, never pushed. The second build reuses the shared build stage from the first.
      - run: docker build --target peer -t peerwire-peer:ci .
      - run: docker build --target examples -t peerwire-examples:ci .

  # Next: a `godot` job building the GDExtension (NB-020) goes here, Linux only to start.
