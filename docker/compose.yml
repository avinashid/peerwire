# The optional always-on peer and the browser demos, on this machine only (see docs/guides/always-on-peer.md).
# From the repo root:
#
#   docker compose -f docker/compose.yml up -d --build
#   docker compose -f docker/compose.yml exec peer peerwire-peer check   # or: ... logs peer (prints the invite)
#
# Compose reads a .env file next to this one (docker/.env), not at the repo root.
#
# Logs are capped at three 10 MB files per service; the peer's hold the IP:port of every linked peer.
#
# Nothing listens beyond localhost by default:
#   peer      UDP 127.0.0.1:7700 (host network, so its invite and the addresses it sees are the real ones);
#             set PEERWIRE_BIND=0.0.0.0:7700 to make it reachable from other hosts.
#   examples  http://127.0.0.1:7780 (set PEERWIRE_EXAMPLES_PORT to change the port).

# Without a name, Compose would name the project after this directory ("docker").
name: peerwire

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  peer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: peer
    image: peerwire-peer
    network_mode: host
    environment:
      PEERWIRE_BIND: ${PEERWIRE_BIND:-127.0.0.1:7700}
      PEERWIRE_STUN: ${PEERWIRE_STUN:-}
      PEERWIRE_MAX_PEERS: ${PEERWIRE_MAX_PEERS:-256}
      PEERWIRE_RELAY_RATE: ${PEERWIRE_RELAY_RATE:-262144}
      PEERWIRE_RELAY_TOTAL: ${PEERWIRE_RELAY_TOTAL:-8388608}
    volumes:
      - peer-data:/data
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

  examples:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: examples
    image: peerwire-examples
    ports:
      - "127.0.0.1:${PEERWIRE_EXAMPLES_PORT:-7780}:8080"
    tmpfs:
      - /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 64
    restart: unless-stopped
    logging: *logging

volumes:
  peer-data:
