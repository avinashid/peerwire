[package]
name = "peerwire-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Shared documents for Peerwire: maps, sets and logs that every member holds and that converge, in the frames of @peerwire/js room.doc()"
readme = "README.md"
keywords = ["crdt", "p2p", "collaboration", "local-first", "sync"]
categories = ["data-structures", "network-programming"]
# A package ships its sources, README and licences; tests, examples and fixtures stay in the repo.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
peerwire-core = { version = "0.1.0", path = "../peerwire-core" }
rand_core = "0.6"
rand_chacha = "0.3"

[dev-dependencies]
# The fuzz harness (peerwire_sim::fuzz).
peerwire-sim = { path = "../peerwire-sim" }
# Reading the golden vectors doc.js makes (never the frames under test), and their digests. Both are in the lock
# file already (the facade's nostr feature, ed25519-dalek).
serde_json = "1"
sha2 = "0.10"
