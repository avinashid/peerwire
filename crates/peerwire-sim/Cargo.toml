[package]
name = "peerwire-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Deterministic network simulator for Peerwire: real endpoints over simulated latency, loss, uplinks and NATs, in virtual time"
readme = "README.md"
keywords = ["p2p", "simulator", "networking", "deterministic", "testing"]
categories = ["simulation", "network-programming", "development-tools::testing"]

[dependencies]
# The TURN codec, for the TURN server (src/turn.rs).
peerwire-core = { path = "../peerwire-core", features = ["turn"] }
rand_core = "0.6"
rand_chacha = "0.3"


[dev-dependencies]
peerwire-game = { path = "../peerwire-game" }
# The NAT traversal layer, driven over simulated NATs.
peerwire = { path = "../peerwire" }
# Shared documents over simulated links (tests/sync.rs).
peerwire-sync = { path = "../peerwire-sync" }
