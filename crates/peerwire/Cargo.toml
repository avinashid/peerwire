[package]
name = "peerwire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Peer-to-peer nodes over UDP with no server: STUN, rooms, signaling and NAT traversal on peerwire-core"
readme = "README.md"
keywords = ["p2p", "nat-traversal", "udp", "multiplayer", "hole-punching"]
categories = ["network-programming", "game-development", "asynchronous"]
# A package ships its sources, README and licences; tests, examples and fixtures stay in the repo.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[package.metadata.docs.rs]
# The async host, Nostr signaling, the Bluetooth transport and its ESP-NOW radio as well as the default TURN client;
# not `testing`, which is for bindings.
features = ["tokio", "nostr", "ble", "espnow", "files", "webrtc"]

[dependencies]
peerwire-core = { version = "0.1.0", path = "../peerwire-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
# Deterministic randomness in the sans-IO traversal (already used by peerwire-sim and peerwire-ffi).
rand_chacha = "0.3"
# SHA-256 for signaling topics, as nostr.js computes them (already in the tree through k256).
sha2 = "0.10"
# HMAC-SHA256 room proofs on hellos and room offers (RustCrypto, same family as sha2).
hmac = "0.12"
# AES-256-GCM seal on room hellos, as nostr.js seals them (SEC-2); WebCrypto has no ChaCha20-Poly1305 (RustCrypto).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Dual-stack sockets: IPV6_V6ONLY off before bind, which std can't set (already in the tree through tokio).
socket2 = "0.6"
# Optional async host; the sync Node needs no runtime.
tokio = { version = "1", optional = true, default-features = false, features = ["net", "time", "macros", "rt", "sync"] }
# Nostr signaling (feature `nostr`): websocket client, TLS, BIP-340 signatures, relay JSON.
tungstenite = { version = "0.24", optional = true, default-features = false, features = ["handshake"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
k256 = { version = "0.13", optional = true, default-features = false, features = ["schnorr", "arithmetic"] }
serde_json = { version = "1", optional = true }
# log (features `ble` and `nostr`) for the radio's connections, and pipes held or given up (already tungstenite's).
log = { version = "0.4", optional = true }
# WebRTC to browsers (feature `webrtc`, docs/concepts/native-webrtc.md): sans-IO ICE, DTLS (dimpl) and SCTP data
# channels, on AWS-LC (aws-lc-rs: str0m's default backend; its `rust-crypto` one pulls AWS-LC in too, for rcgen). 0.24
# is the newest on our MSRV (0.25 asks for 1.89). serde_json (the `nostr` feature's) reads the browser's signals.
str0m = { version = "0.24.1", optional = true, default-features = false, features = ["aws-lc-rs"] }

# Private LAN/hotspot addresses for a socket bound to any interface (getifaddrs; libc is already in the tree).
# ESP-IDF has no getifaddrs.
[target.'cfg(not(target_os = "espidf"))'.dependencies]
if-addrs = "0.15"

# SO_REUSEPORT, which BSDs need for a second LanSignaling on one broadcast address, and SO_BINDTODEVICE, which keeps
# a Linux broadcast leg to its own interface (NB92-3).
[target.'cfg(any(target_vendor = "apple", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

# SHA-256 on the ARMv8 SHA instructions (NB-168), for Share's file hashing above all (29% of a transfer's CPU in
# software): sha2 0.10 has that backend (core::arch intrinsics, taken at run time if the CPU has them, the portable
# code if not) only with its `asm` feature, which also builds sha2-asm (MIT, RustCrypto: assembly, with the host's C
# compiler through cc), unused on aarch64. Only where sha2's CPU check works (Linux, Android, Apple); sha2-asm doesn't
# build for Windows. x86-64 takes SHA-NI without it, and neither the wasm module nor the ESP32 port has it.
[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "android", target_vendor = "apple")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[features]
# The TURN client (RFC 8656 over UDP; Builder::turn_servers). On by default; the ESP32 port turns it off.
default = ["turn"]
turn = ["peerwire-core/turn"]
tokio = ["dep:tokio"]
nostr = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots", "dep:k256", "dep:serde_json", "dep:log"]
# Bluetooth LE (docs/concepts/bluetooth.md): the radio driver trait and the node's side of it (Builder::bluetooth),
# which logs its connections through `log`. Off by default. The Linux driver (`ble::BlueZ`, feature `ble-bluez`, on
# BlueZ over D-Bus) is held out of 0.2.0 until it has passed its test on real hardware; an app gives the node its own
# `ble::Radio` meanwhile.
ble = ["dep:log", "peerwire-core/ble"]
# ESP-NOW (docs/concepts/espnow.md): a Bluetooth radio over Espressif's ESP-NOW frames, for a platform that gives it
# its ESP-NOW (`espnow::Ether`); `peerwire-esp` gives the ESP32's. No dependency of its own.
espnow = ["ble"]
# Peerwire Share (peerwire::files, docs/concepts/share-protocol.md): files of any size in checked pieces, in the
# protocol of the Share page, streamed from and to disk. No dependency of its own (sha2 and rand are already here).
# Off by default; nothing of it is in the wasm module (peerwire-ffi) or the ESP32 port.
files = []
# WebRTC to browsers (docs/concepts/native-webrtc.md): in a room, the node links with joinRoom pages over a WebRTC
# DataChannel on its own socket (str0m), as room.js links pages, with room.js's room layer (the link proof, presence,
# goodbye) on those links. Off by default; never in the wasm module (peerwire-ffi) or the ESP32 port.
webrtc = ["dep:str0m", "dep:serde_json"]
# Test hooks (Builder::port_mapping_at, a fake gateway's address; Node::note_sources, where the socket's datagrams
# came from; ble::FakeAir, radios in one process). Not for apps.
testing = []

[lints.rust]
# --cfg docs_samples (rustdoc only) brings in the docs' Rust samples as compile-only doc tests (mod doc_samples).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docs_samples)"] }

[dev-dependencies]
peerwire-core = { path = "../peerwire-core" }
# Tests and examples cover the async host, Nostr signaling and WebRTC too, and tests use the test hooks
# (Node::sources).
peerwire = { path = ".", features = ["tokio", "nostr", "testing", "ble", "espnow", "files", "webrtc"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
# The fuzz harness (peerwire_sim::fuzz); a dev-only cycle, the harness deals in bytes.
peerwire-sim = { path = "../peerwire-sim" }
# The docs' samples of shared docs beside a node (mod doc_samples in src/lib.rs).
peerwire-sync = { path = "../peerwire-sync" }
# Reading the golden vectors files.js makes (src/files/tests.rs; already in the lock file through the nostr feature).
serde_json = "1"

[[example]]
name = "echo"
path = "../../examples/rust/echo.rs"

[[example]]
name = "echo_async"
path = "../../examples/rust/echo_async.rs"
required-features = ["tokio"]

[[example]]
name = "lan_chat"
path = "../../examples/rust/lan_chat.rs"

[[example]]
name = "room_chat"
path = "../../examples/rust/room_chat.rs"
required-features = ["nostr"]

[[example]]
name = "doctor"
path = "../../examples/rust/doctor.rs"
required-features = ["nostr"]

[[example]]
name = "nostr_relay"
path = "../../examples/rust/nostr_relay.rs"
required-features = ["nostr"]

[[example]]
name = "share"
path = "../../examples/rust/share.rs"
required-features = ["files"]
