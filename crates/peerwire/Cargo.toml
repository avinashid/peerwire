[package]
name = "peerwire"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Peer-to-peer nodes over UDP with no server: STUN, rooms, signaling and NAT traversal on peerwire-core"
readme = "README.md"
keywords = ["p2p", "nat-traversal", "udp", "multiplayer", "hole-punching"]
categories = ["network-programming", "game-development", "asynchronous"]
# A package ships its sources, README and licences; tests, examples and fixtures stay in the repo.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[package.metadata.docs.rs]
# The async host, Nostr signaling and the Bluetooth transport as well as the default TURN client; not `testing`,
# which is for bindings, nor `ble-bluez`, which would build libdbus there.
features = ["tokio", "nostr", "ble"]

[dependencies]
peerwire-core = { version = "0.1.0", path = "../peerwire-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
# Deterministic randomness in the sans-IO traversal (already used by peerwire-sim and peerwire-ffi).
rand_chacha = "0.3"
# SHA-256 for signaling topics, as nostr.js computes them (already in the tree through k256).
sha2 = "0.10"
# HMAC-SHA256 room proofs on hellos and room offers (RustCrypto, same family as sha2).
hmac = "0.12"
# AES-256-GCM seal on room hellos, as nostr.js seals them (SEC-2); WebCrypto has no ChaCha20-Poly1305 (RustCrypto).
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Dual-stack sockets: IPV6_V6ONLY off before bind, which std can't set (already in the tree through tokio).
socket2 = "0.6"
# Optional async host; the sync Node needs no runtime.
tokio = { version = "1", optional = true, default-features = false, features = ["net", "time", "macros", "rt", "sync"] }
# Nostr signaling (feature `nostr`): websocket client, TLS, BIP-340 signatures, relay JSON.
tungstenite = { version = "0.24", optional = true, default-features = false, features = ["handshake"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
k256 = { version = "0.13", optional = true, default-features = false, features = ["schnorr", "arithmetic"] }
serde_json = { version = "1", optional = true }
# The Linux Bluetooth driver (feature `ble-bluez`): BlueZ over D-Bus. `dbus` only to build libdbus from source
# (`vendored`), as a host may have no libdbus headers or pkg-config; futures for bluer's streams (already its own).
bluer = { version = "0.17", optional = true, default-features = false, features = ["bluetoothd"] }
dbus = { version = "0.9", optional = true, features = ["vendored"] }
futures = { version = "0.3", optional = true, default-features = false, features = ["std"] }

# Private LAN/hotspot addresses for a socket bound to any interface (getifaddrs; libc is already in the tree).
# ESP-IDF has no getifaddrs.
[target.'cfg(not(target_os = "espidf"))'.dependencies]
if-addrs = "0.15"

# SO_REUSEPORT, which BSDs need for a second LanSignaling on one broadcast address, and SO_BINDTODEVICE, which keeps
# a Linux broadcast leg to its own interface (NB92-3).
[target.'cfg(any(target_vendor = "apple", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "linux", target_os = "android"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[features]
# The TURN client (RFC 8656 over UDP; Builder::turn_servers). On by default; the ESP32 port turns it off.
default = ["turn"]
turn = ["peerwire-core/turn"]
tokio = ["dep:tokio"]
nostr = ["dep:tungstenite", "dep:rustls", "dep:webpki-roots", "dep:k256", "dep:serde_json"]
# Bluetooth LE (docs/concepts/bluetooth.md): the radio driver trait and the node's side of it (Builder::bluetooth),
# with no dependencies. Off by default; `ble-bluez` adds the Linux driver.
ble = []
ble-bluez = ["ble", "dep:bluer", "dep:dbus", "dep:futures", "dep:tokio"]
# Test hooks (Builder::port_mapping_at, a fake gateway's address; Node::note_sources, where the socket's datagrams
# came from; ble::FakeAir, radios in one process). Not for apps.
testing = []

[lints.rust]
# --cfg docs_samples (rustdoc only) brings in the docs' Rust samples as compile-only doc tests (mod doc_samples).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docs_samples)"] }

[dev-dependencies]
peerwire-core = { path = "../peerwire-core" }
# Tests and examples cover the async host and Nostr signaling too, and tests use the test hooks (Node::sources).
peerwire = { path = ".", features = ["tokio", "nostr", "testing", "ble"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
# The fuzz harness (peerwire_sim::fuzz); a dev-only cycle, the harness deals in bytes.
peerwire-sim = { path = "../peerwire-sim" }
# The docs' samples of shared docs beside a node (mod doc_samples in src/lib.rs).
peerwire-sync = { path = "../peerwire-sync" }

[[example]]
name = "echo"
path = "../../examples/rust/echo.rs"

[[example]]
name = "echo_async"
path = "../../examples/rust/echo_async.rs"
required-features = ["tokio"]

[[example]]
name = "lan_chat"
path = "../../examples/rust/lan_chat.rs"

[[example]]
name = "room_chat"
path = "../../examples/rust/room_chat.rs"
required-features = ["nostr"]

[[example]]
name = "doctor"
path = "../../examples/rust/doctor.rs"
required-features = ["nostr"]

[[example]]
name = "nostr_relay"
path = "../../examples/rust/nostr_relay.rs"
required-features = ["nostr"]
