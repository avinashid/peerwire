[package]
name = "peerwire-game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Deterministic fixed-point maths, Hilbert-curve islands and desync detection for P2P multiplayer games"
readme = "README.md"
keywords = ["gamedev", "fixed-point", "deterministic", "lockstep", "multiplayer"]
categories = ["game-development", "mathematics"]
# A package ships its sources, README and licences; tests, examples and fixtures stay in the repo.
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
siphasher = "1.0"

[dev-dependencies]
rand_core = "0.6"
rand_chacha = "0.3"
