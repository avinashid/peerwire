[package]
name = "peerwire-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Sans-IO peer-to-peer session core for Peerwire: Noise IK links, reliable, urgent and unreliable lanes, congestion control, peer relay and hole punching"
readme = "README.md"
keywords = ["p2p", "networking", "noise", "nat-traversal", "sans-io"]
categories = ["network-programming", "cryptography"]

[dependencies]
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize", "rand_core"] }
rand_core = "0.6"
rand_chacha = "0.3"
# TURN's long-term credentials (RFC 8656, stun.rs): MESSAGE-INTEGRITY is HMAC-SHA1 under MD5(user:realm:pass), which
# TURN servers (coturn, Cloudflare) require. RustCrypto, as sha2 and hmac in peerwire; sha1 and hmac are already in
# the tree (tungstenite, room proofs). Unused by the FFI; without their default `std` (digest's), the wasm is as
# large as without them.
hmac = "0.12"
sha1 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
# The fuzz harness (src/fuzz.rs); a dev-only cycle, the harness deals in bytes.
peerwire-sim = { path = "../peerwire-sim" }
