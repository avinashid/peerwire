[workspace]
resolver = "2"
members = [
    "crates/peerwire-core",
    "crates/peerwire-sim",
    "crates/peerwire-ffi",
    "crates/peerwire-game",
    "crates/peerwire",
    "crates/peerwire-peer",
    "crates/peerwire-sync",
    "bindings/godot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avinashid/peerwire"
homepage = "https://avinashid.github.io/peerwire/"
# The oldest Rust the published crates build with: the code calls is_multiple_of (1.87) and the arena example
# as_chunks (1.88); the dependencies ask for 1.85 at most (snow 0.10, tokio, zeroize). clippy's incompatible_msrv
# lint holds the code to it, and CI's msrv job builds the published crates with it.
rust-version = "1.88"

# The test builds of scripts/gate.sh (docs/project/testing.md). Neither changes what ships: that is the release
# profile, left at cargo's defaults.
# gate: the release tests, built incrementally, so a change rebuilds only what it touched. Same code as release:
# opt-level 3, no debug assertions, integer overflow wraps.
[profile.gate]
inherits = "release"
incremental = true

# fuzz: the fuzzers with a debug build's checks (overflow panics, debug assertions), optimised a little, so their
# fixed number of cases runs several times faster.
[profile.fuzz]
inherits = "dev"
opt-level = 1
