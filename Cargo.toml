[workspace]
resolver = "3"
members = [
    "crates/peerwire-core",
    "crates/peerwire-sim",
    "crates/peerwire-ffi",
    "crates/peerwire-game",
    "crates/peerwire",
    "crates/peerwire-peer",
    "crates/peerwire-sync",
    "bindings/godot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avinashid/peerwire"
homepage = "https://avinashid.github.io/peerwire/"
# The oldest Rust the published crates build with: the code calls is_multiple_of (1.87) and the arena example
# as_chunks (1.88); the dependencies ask for 1.85 at most (snow 0.10, tokio, zeroize, uuid 1.26). clippy's
# incompatible_msrv lint holds the code to it, the gate's rust-version step (scripts/rust-version.mjs) the lock, and
# CI's msrv job builds the published crates with it. Resolver 3 has cargo update pick dependencies that fit it.
rust-version = "1.88"

# The release profile: cargo's defaults, which native builds take as they are. The browser module's build
# (packages/js/build.sh) sets it, through CARGO_PROFILE_RELEASE_*, to opt-level "s" (with LTO, one codegen unit, abort
# on panic, stripped) for everything but these three: the core's per-packet crypto (ChaCha20-Poly1305, through snow),
# which at "s" took about a third of a page's main thread for each datagram. At opt-level 3 it takes the core less
# than half the time per datagram, for about 6.6 KB more wasm (NB-167, NB-168). Native release builds are at
# opt-level 3 already, so this changes nothing for them, nor for the gate profile below.
[profile.release.package.snow]
opt-level = 3

[profile.release.package.chacha20]
opt-level = 3

[profile.release.package.poly1305]
opt-level = 3

# The test builds of scripts/gate.sh (docs/project/testing.md). Neither changes what ships: that is the release
# profile.
# gate: the release tests, built incrementally, so a change rebuilds only what it touched. Same code as release:
# opt-level 3, no debug assertions, integer overflow wraps.
[profile.gate]
inherits = "release"
incremental = true

# fuzz: the fuzzers with a debug build's checks (overflow panics, debug assertions), optimised a little, so their
# fixed number of cases runs several times faster.
[profile.fuzz]
inherits = "dev"
opt-level = 1
