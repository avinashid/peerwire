[package]
name = "peerwire-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avinashid/peerwire"
homepage = "https://avinashid.github.io/peerwire/"
description = "A Peerwire prototype on the ESP32-C3 and ESP32 under ESP-IDF: chips find each other over LanSignaling and link peer to peer"
readme = "README.md"
keywords = ["esp32", "esp-idf", "embedded", "p2p", "iot"]
categories = ["embedded", "network-programming"]
publish = false
rust-version = "1.82"

# Not a member of the repo's workspace: it builds for the ESP32-C3 and ESP32 only, with their own toolchains (see README.md).
[workspace]

[[bin]]
name = "peerwire-esp32"
harness = false

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
peerwire = { path = "../../crates/peerwire" }
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"

[build-dependencies]
embuild = "0.33.5"
