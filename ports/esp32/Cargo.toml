[package]
name = "peerwire-esp"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/avinashid/peerwire"
homepage = "https://avinashid.github.io/peerwire/"
documentation = "https://avinashid.github.io/peerwire/docs/guides/esp32"
description = "Peerwire on the ESP32-C3 and ESP32 under ESP-IDF: Wi-Fi, a clock set by SNTP before the node binds, caps sized for the chip, and LAN and Nostr signaling"
readme = "README.md"
keywords = ["esp32", "esp-idf", "embedded", "p2p", "iot"]
categories = ["embedded", "network-programming"]
rust-version = "1.88"
include = [
  "/src", "/examples", "/build.rs", "/README.md", "/sdkconfig.defaults", "/sdkconfig.ble", "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

# Not a member of the repo's workspace: it builds for the ESP32-C3 and ESP32 only, with their own toolchains (see README.md).
[workspace]

[features]
# Rooms across the internet over a Nostr relay (Board::node_with_nostr). Its TLS (rustls on ring) compiles C with the
# chip's GCC: see README.md.
nostr = ["peerwire/nostr", "dep:ring"]
# Bluetooth LE on ESP-IDF's NimBLE (NB-110). ESP-IDF must be built with sdkconfig.ble too: build.sh does it.
ble = ["dep:esp32-nimble"]

# The port's mesh test: QEMU's emulated chips, or a board on Wi-Fi (run.sh, wifi.sh, room.sh).
[[example]]
name = "mesh"
required-features = ["nostr"]

# NimBLE's footprint next to a Node, and a GATT echo (NB-110c): `FEATURES=ble EXAMPLE=ble_probe ./build.sh`.
[[example]]
name = "ble_probe"
required-features = ["ble"]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
# Without the default TURN client (NB-099): a follow-up, as is its code size here.
peerwire = { version = "0.1.0", path = "../../crates/peerwire", default-features = false }
esp-idf-svc = "0.53"
log = "0.4"
anyhow = "1"
# Nostr signaling's TLS (rustls on ring): ring draws from esp_fill_random only with this
# feature, and the firmware starts Wi-Fi before any draw (NB62-2).
ring = { version = "0.17", features = ["less-safe-getrandom-espidf"], optional = true }
esp32-nimble = { version = "0.13", optional = true }

[dev-dependencies]
# ble_probe times a handshake between two endpoints in memory.
peerwire-core = { version = "0.1.0", path = "../../crates/peerwire-core" }

[build-dependencies]
embuild = "0.33.5"
